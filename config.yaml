exchange:
  name: kraken            # US-friendly: no geo-restrictions, works without API keys for public data
  sandbox: true          # Use testnet/sandbox when available — ALWAYS true until proven edge

trading:
  pairs:
    - BTC/USDT
    - ETH/USDT
  timeframe: 1h          # Candle interval for raw data stored in DB
  starting_capital: 1000.0

backtest:
  fee_rate: 0.0026       # 0.26% Kraken taker fee (slightly higher than Binance)
  slippage_rate: 0.0005  # 0.05% slippage estimate for liquid pairs
  start_date: "2024-01-01"
  end_date: "2026-04-09"

risk:
  max_position_pct: 0.20    # Max 20% of capital in any single position
  max_drawdown_pct: 0.15    # Circuit breaker: stop all trading at 15% drawdown from peak
  stop_loss_pct: 0.03       # 3% stop loss per trade
  take_profit_pct: 0.06     # 6% take profit (2:1 reward:risk ratio)
  max_open_positions: 3     # Maximum simultaneous open positions
  risk_per_trade_pct: 0.01  # Risk 1% of equity per trade (position sizing)

strategies:
  bollinger_rsi:
    # Run with: python scripts/run_backtest.py --strategy bollinger_rsi --resample 1D
    # Classic daily-timeframe parameters. TP targets the middle band (SMA-20),
    # which is the natural mean-reversion target — much more achievable than
    # the upper band or a fixed ATR multiple.
    bb_period: 20              # 20-day Bollinger Band lookback
    bb_std: 2.0                # Band width in standard deviations
    rsi_period: 14             # 14-day RSI
    rsi_oversold: 30           # Buy threshold (classic daily oversold)
    rsi_overbought: 70         # Upper-band sell threshold
    atr_period: 14             # 14-day ATR for stop sizing
    atr_stop_multiplier: 2.0   # Stop = entry - (ATR × 2); TP = middle BB
    trend_ma: 0                # 0 = disabled (trend filter blocks oversold signals)

  momentum:
    # Run with: --resample 1D
    # Sweep result: fast=3/slow=15 gives best quality (Sharpe 0.957, PF 2.988) on daily BTC.
    # Trade count (12) still below 30-trade gate — 2024-26 bull run limits crossover frequency.
    fast_ma: 3                 # 3-day fast SMA (sweep best: Sharpe 0.957, PF 2.988)
    slow_ma: 15                # 15-day slow SMA
    trend_ma: 50               # 50-day trend filter (only buy above 50-day SMA)
    atr_period: 14             # 14-day ATR for stop loss
    atr_stop_multiplier: 2.0   # Stop = entry - (ATR × 2)

  grid:
    # Run with: --resample 1D
    # ADX regime filter: only trade when ADX < adx_threshold (ranging market).
    # This avoids the large circuit-breaker losses that happen during strong trends.
    grid_levels: 10            # Number of buy/sell grid levels
    grid_spread_pct: 0.02      # 2% price distance between grid levels
    pair: BTC/USDT             # Grid works best focused on one pair
    range_pct: 0.20            # Total grid range (±10% around center)
    adx_threshold: 35          # Only enter when ADX < 35 (sweep: 41 trades, PF 1.362 at thr=35)
    adx_period: 14             # 14-day ADX lookback
